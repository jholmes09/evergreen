name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ release-2026.03 ]
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v2

    - name: Install ISPC
      uses: ispc/install-ispc-action@main
      with:
        version: 1.30.0

    # wxWidgets never changes between our builds, so keep the built copy and reuse it.
    # The key includes the runner image so a compiler update forces a fresh build.
    - name: Runner image
      id: image
      shell: pwsh
      run: echo "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT

    - name: Restore wxWidgets
      id: wxcache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}\..\wxWidgets
        key: wxWidgets-xlights_2026.02-x64-Release-${{ steps.image.outputs.version }}

    # No xlights_2026.03 tag exists in the wxWidgets fork; 2026.02 is the last one before it.
    - name: Download wxWidgets
      if: steps.wxcache.outputs.cache-hit != 'true'
      run: git clone --depth=1 --shallow-submodules --recurse-submodules -b xlights_2026.02 https://github.com/xLightsSequencer/wxWidgets ..\wxWidgets\

    - name: Build wxWidgets
      if: steps.wxcache.outputs.cache-hit != 'true'
      working-directory: ..\wxWidgets\
      run: msbuild /m .\build\msw\wx_vc17.sln /p:Configuration="Release" /p:Platform="x64"

    # Intermediate object files are not needed to build against wxWidgets; dropping them keeps the saved copy small.
    - name: Trim wxWidgets build files
      if: steps.wxcache.outputs.cache-hit != 'true'
      working-directory: ..\wxWidgets\
      shell: pwsh
      run: Get-ChildItem -Path build\msw -Recurse -File -Include *.obj,*.pch,*.tlog,*.ilk | Remove-Item -Force

    - name: Build xLights and xSchedule
      shell: cmd
      working-directory: build_scripts/msw
      run: call build_VS_x64_skip_libltc.cmd

    - name: Build installer
      working-directory: build_scripts/msw
      run: ISCC.exe xLights_4_64bit_VS.iss

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows_x64_Installer
        path: 'build_scripts\msw\output\*.exe'
        retention-days: 30
