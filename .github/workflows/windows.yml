name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v2

    - name: Install ISPC
      uses: ispc/install-ispc-action@main
      with:
        version: 1.28.1

    # No xlights_2025.11 tag exists in the wxWidgets fork; 2025.09 is the last one before it.
    - name: Download wxWidgets
      run: git clone --depth=1 --shallow-submodules --recurse-submodules -b xlights_2025.09 https://github.com/xLightsSequencer/wxWidgets ..\wxWidgets\

    - name: Build wxWidgets
      working-directory: ..\wxWidgets\
      run: msbuild /m .\build\msw\wx_vc17.sln /p:Configuration="Release" /p:Platform="x64"

    - name: Build xLights and xSchedule
      shell: cmd
      working-directory: build_scripts/msw
      run: call build_VS_x64_skip_libltc.cmd

    - name: Build installer
      working-directory: build_scripts/msw
      run: ISCC.exe xLights_4_64bit_VS.iss

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows_x64_Installer
        path: 'build_scripts\msw\output\*.exe'
        retention-days: 30
